    <path d="M30 96 C30 78 46 70 62 70 H92 V228 H52 C40 228 30 218 30 206 Z" fill="url(#grip)"/>
    <path d="M60 78 H88 V220 H60 Z" fill="#1A1A1E" opacity=".8"/>
    <g fill="#26262B"><rect x="64" y="96" width="20" height="4" rx="2"/><rect x="64" y="108" width="20" height="4" rx="2"/><rect x="64" y="120" width="20" height="4" rx="2"/><rect x="64" y="132" width="20" height="4" rx="2"/><rect x="64" y="144" width="20" height="4" rx="2"/><rect x="64" y="156" width="20" height="4" rx="2"/><rect x="64" y="168" width="20" height="4" rx="2"/></g>
    <!-- disparador y dial -->
    <circle cx="80" cy="64" r="11" fill="#2E2E33"/><circle cx="80" cy="63" r="7" fill="#C9C9CE"/>
    <circle cx="322" cy="62" r="17" fill="#2A2A2F"/><circle cx="322" cy="62" r="12" fill="#3A3A40"/><rect x="321" y="52" width="2" height="6" fill="#E0169B"/>
    <circle cx="358" cy="66" r="9" fill="#2A2A2F"/>
    <!-- montura y objetivo -->
    <circle cx="225" cy="150" r="70" fill="url(#ring)"/>
    <circle cx="225" cy="150" r="63" fill="#151518"/>
    <circle cx="225" cy="150" r="58" fill="url(#ring)"/>
    <circle cx="225" cy="150" r="50" fill="#0B0B0E"/>
    <circle cx="225" cy="150" r="44" fill="url(#glass)"/>
    <circle cx="225" cy="150" r="30" fill="#0A1526" opacity=".9"/>
    <circle cx="225" cy="150" r="18" fill="#132A4E"/>
    <ellipse cx="208" cy="132" rx="14" ry="8" fill="#fff" opacity=".18" transform="rotate(-30 208 132)"/>
    <circle cx="225" cy="150" r="63" fill="none" stroke="#6B6B73" stroke-width="1.5" opacity=".6"/>
    <!-- detalles -->
    <rect x="310" y="112" width="60" height="30" rx="6" fill="#1A1A1E"/><rect x="316" y="118" width="48" height="18" rx="3" fill="#0A0A0C"/>
    <circle cx="312" cy="172" r="8" fill="#26262B"/><circle cx="340" cy="172" r="8" fill="#26262B"/><circle cx="368" cy="172" r="8" fill="#26262B"/>
    <circle cx="150" cy="96" r="6" fill="#26262B"/>
    <rect x="120" y="205" width="200" height="6" rx="3" fill="#000" opacity=".5"/>
