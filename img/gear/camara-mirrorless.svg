<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="Cámara mirrorless">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A40"/><stop offset=".5" stop-color="#1E1E22"/><stop offset="1" stop-color="#0E0E11"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A52"/><stop offset="1" stop-color="#26262B"/></linearGradient>
    <radialGradient id="glass" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#3C5A8C"/><stop offset=".45" stop-color="#10203A"/><stop offset="1" stop-color="#05070C"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B6B73"/><stop offset=".5" stop-color="#2A2A2F"/><stop offset="1" stop-color="#55555D"/></linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A1A1E"/><stop offset="1" stop-color="#2C2C31"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#sh)">
