<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Cámara réflex DSLR">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A40"/><stop offset=".5" stop-color="#1E1E22"/><stop offset="1" stop-color="#0E0E11"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A52"/><stop offset="1" stop-color="#26262B"/></linearGradient>
    <radialGradient id="glass" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#8C4B3C"/><stop offset=".45" stop-color="#2A1410"/><stop offset="1" stop-color="#06050A"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B6B73"/><stop offset=".5" stop-color="#2A2A2F"/><stop offset="1" stop-color="#55555D"/></linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1A1A1E"/><stop offset="1" stop-color="#2C2C31"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- pentaprisma y zapata -->
    <path d="M160 70 L182 24 H258 L280 70 Z" fill="url(#top)"/>
    <rect x="203" y="14" width="34" height="12" rx="3" fill="#2E2E33"/><rect x="208" y="18" width="24" height="5" rx="1" fill="#111"/>
    <!-- cuerpo -->
    <rect x="24" y="66" width="372" height="190" rx="24" fill="url(#body)"/>
    <rect x="24" y="66" width="372" height="28" rx="14" fill="url(#top)" opacity=".9"/>
    <!-- empuñadura -->
    <path d="M24 108 C24 84 44 74 66 74 H100 V256 H52 C36 256 24 244 24 228 Z" fill="url(#grip)"/>
    <path d="M62 84 H96 V246 H62 Z" fill="#1A1A1E" opacity=".8"/>
    <g fill="#26262B"><rect x="68" y="104" width="22" height="4" rx="2"/><rect x="68" y="116" width="22" height="4" rx="2"/><rect x="68" y="128" width="22" height="4" rx="2"/><rect x="68" y="140" width="22" height="4" rx="2"/><rect x="68" y="152" width="22" height="4" rx="2"/><rect x="68" y="164" width="22" height="4" rx="2"/><rect x="68" y="176" width="22" height="4" rx="2"/><rect x="68" y="188" width="22" height="4" rx="2"/></g>
    <!-- disparador, pantalla superior y dial -->
    <circle cx="84" cy="70" r="12" fill="#2E2E33"/><circle cx="84" cy="69" r="8" fill="#C9C9CE"/>
    <rect x="290" y="56" width="74" height="26" rx="6" fill="#1A1A1E"/><rect x="296" y="61" width="62" height="16" rx="3" fill="#B7C7B5"/>
    <circle cx="140" cy="66" r="18" fill="#2A2A2F"/><circle cx="140" cy="66" r="13" fill="#3A3A40"/><rect x="139" y="55" width="2" height="6" fill="#E0169B"/>
    <!-- montura y objetivo -->
    <circle cx="222" cy="168" r="80" fill="url(#ring)"/>
    <circle cx="222" cy="168" r="72" fill="#151518"/>
    <circle cx="222" cy="168" r="66" fill="url(#ring)"/>
    <circle cx="222" cy="168" r="58" fill="#0B0B0E"/>
    <circle cx="222" cy="168" r="50" fill="url(#glass)"/>
    <circle cx="222" cy="168" r="34" fill="#160C0A" opacity=".9"/>
    <circle cx="222" cy="168" r="20" fill="#3A1C14"/>
    <ellipse cx="203" cy="148" rx="16" ry="9" fill="#fff" opacity=".18" transform="rotate(-30 203 148)"/>
    <circle cx="222" cy="168" r="72" fill="none" stroke="#6B6B73" stroke-width="1.5" opacity=".6"/>
    <circle cx="222" cy="168" r="80" fill="none" stroke="#CC0000" stroke-width="3" opacity=".9"/>
    <!-- detalles -->
    <circle cx="322" cy="126" r="9" fill="#26262B"/><circle cx="350" cy="126" r="9" fill="#26262B"/>
    <rect x="308" y="160" width="66" height="44" rx="8" fill="#1A1A1E"/><rect x="315" y="167" width="52" height="30" rx="4" fill="#0A0A0C"/>
    <circle cx="160" cy="104" r="7" fill="#26262B"/>
    <rect x="118" y="232" width="210" height="6" rx="3" fill="#000" opacity=".5"/>
  </g>
</svg>
